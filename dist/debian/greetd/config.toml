# /etc/greetd/config.toml — sudo install -Dm644 greetd/config.toml /etc/greetd/config.toml
# The session runs through a LOGIN shell (zsh -l) so ~/.nix-profile/bin is on PATH and
# niri-session can resolve `niri` by name — Nix is not on the default greeter PATH.
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --remember --cmd 'zsh -l -c niri-session'"
user = "greeter"
