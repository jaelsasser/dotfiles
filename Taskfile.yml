version: '3'
silent: true   # match the old script: don't echo command lines, just their output

# Repo-dev runner (NOT deployed; lives beside run-tests.sh / chezmoi.bats).
# Versions are pinned in mise.toml. chezmoi calls route through `mise exec` when mise
# is on PATH, so `task sideload` uses the pinned chezmoi no matter how `task` launched;
# without mise it falls back to the PATH chezmoi.
vars:
  CHEZMOI:
    sh: command -v mise >/dev/null 2>&1 && echo 'mise exec -- chezmoi' || echo chezmoi

tasks:
  sideload:
    desc: Promote this checkout's branch into the chezmoi source clone, then preview the delta
    vars:
      SRC:
        sh: "{{.CHEZMOI}} data --format=json | jq -r .chezmoi.workingTree"
      BRANCH:
        sh: git branch --show-current   # override: task sideload BRANCH=foo
    cmds:
      - git -C "{{.SRC}}" remote get-url local >/dev/null 2>&1 || git -C "{{.SRC}}" remote add local "{{.ROOT_DIR}}"
      - git -C "{{.SRC}}" fetch local "{{.BRANCH}}"
      - git -C "{{.SRC}}" rebase "local/{{.BRANCH}}"
      # Block scalars: the banners' `with: ` colons would otherwise read as YAML mappings.
      - cmd: |-
          printf '\nStaged %s@%s into %s. Preview the delta:\n\n' "{{.ROOT_DIR}}" "{{.BRANCH}}" "{{.SRC}}"
      - "{{.CHEZMOI}} diff"
      - cmd: |-
          printf '\nGo live with: chezmoi apply   (publish with: git -C %s push origin stable)\n' "{{.SRC}}"

  # Nix home-manager (packages/fonts/niri) reads the chezmoi CLONE, not this checkout —
  # so the loop is: edit nix/ here → task sideload → task nix:switch.
  nix:switch:
    desc: Apply the home-manager flake from the chezmoi clone
    vars:
      SRC:
        sh: "{{.CHEZMOI}} data --format=json | jq -r .chezmoi.workingTree"
    cmds:
      - home-manager switch --flake "{{.SRC}}/nix#josh@trixie" {{.CLI_ARGS}}
      - cmd: |-
          printf 'If Mesa changed: run the sudo non-nixos-gpu-setup line printed above, then reboot.\n'

  nix:update:
    desc: Bump flake inputs then switch
    vars:
      SRC:
        sh: "{{.CHEZMOI}} data --format=json | jq -r .chezmoi.workingTree"
    cmds:
      - nix flake update --flake "{{.SRC}}/nix"
      - home-manager switch --flake "{{.SRC}}/nix#josh@trixie" {{.CLI_ARGS}}

  farm:gen:
    desc: Regenerate the emacs symlink-farm stubs from emacs/*.el (claude stays manual)
    cmds:
      - ./gen-farm.sh

  test:
    desc: Run the bats + pytest regression suite (extra args after --)
    cmds:
      - ./run-tests.sh {{.CLI_ARGS}}

  test:emacs:
    desc: Run the slow emacs bootstrap regression (clones ~50 packages; needs emacs)
    cmds:
      - bats emacs/emacs.bats

  # Scoped startup-time benches over the LIVE deployed config (~/.config/*), not a
  # throwaway $HOME like the tests — warm, read-only, report-only (never fail).
  # Override the sample count with BENCH_RUNS (default 10).
  bench:
    desc: Scoped startup benches for zsh + nvim + emacs (live config; report-only)
    cmds:
      - ./bench/zsh.zsh
      - echo
      - ./bench/nvim.sh
      - echo
      - ./bench/emacs.sh

  bench:zsh:
    desc: zsh startup bench (per-stage + zprof, live ~/.config/zsh)
    cmds: [./bench/zsh.zsh]
  bench:nvim:
    desc: nvim startup bench (phases + per-plugin, live ~/.config/nvim)
    cmds: [./bench/nvim.sh]
  bench:emacs:
    desc: emacs startup bench (use-package per-package, live ~/.config/emacs)
    cmds: [./bench/emacs.sh]
