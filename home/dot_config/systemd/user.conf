# The systemd *user manager* computes its unit search path from its OWN XDG_DATA_DIRS at startup —
# environment.d does NOT reach it. Without ~/.nix-profile/share here, niri.service (installed by the
# Nix package) is "not found" → graphical-session.target never activates → portals cascade-fail.
# %h is a systemd specifier (no chezmoi template). daemon-reload after changing this.
[Manager]
ManagerEnvironment=XDG_DATA_DIRS=%h/.nix-profile/share:/usr/local/share:/usr/share
